name: macOS Native Image

# Pushes to main build and smoke-test the macOS native image in quick mode.
# The weekly run keeps the full optimized build as a backstop before the Sunday
# release. PRs run the same quick build and smoke tests on Linux (see pr.yml).

on:
  push:
    branches:
      - main
  schedule:
    # Saturday 04:23 UTC — backstop ahead of the Sunday release build.
    - cron: "23 4 * * 6"
  workflow_dispatch:
    inputs:
      quick_build:
        description: Use the quicker native build instead of full optimization
        type: boolean
        required: false
        default: false

# No concurrency group: each push to main builds to completion so every merge
# gets its own macOS native-image signal.

permissions:
  contents: read

jobs:
  isthmus-native-image-macos:
    name: Build Isthmus Native Image (macOS)
    if: >-
      github.repository == 'substrait-io/substrait-java' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 25
        distribution: graalvm
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
    - name: Report Java Version
      run: java -version
    - name: Build with Gradle
      run: |
        if [[ "$QUICK_BUILD" == "true" ]]; then
          ./gradlew nativeCompile --quick-build-native
        else
          ./gradlew nativeCompile
        fi
      env:
        QUICK_BUILD: ${{ github.event_name == 'push' || inputs.quick_build }}
    - name: Smoke Test
      run: |
        ./isthmus-cli/src/test/script/smoke.sh
        ./isthmus-cli/src/test/script/tpch_smoke.sh
